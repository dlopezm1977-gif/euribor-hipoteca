name: Sync Euribor

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Días hacia atrás a sincronizar (usa un número grande, p. ej. 3000, para recargar todo el histórico)'
        required: false
        default: '7'
        type: string

permissions:
  contents: read

concurrency:
  group: sync-euribor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EURIBOR_LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: npm run sync:euribor
